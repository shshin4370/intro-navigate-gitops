apiVersion: apps/v1
kind: Deployment
metadata:
  name: intro-navigate
  namespace: myapp
  labels:
    app: intro-navigate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intro-navigate
  template:
    metadata:
      labels:
        app: intro-navigate
    spec:
      containers:
        - name: intro-navigate
          image: image-registry.openshift-image-registry.svc:5000/myapp/intro-navigate@sha256:b5635cbadad2dcb940876def902ded388090a9d66369e40379ae745e948a8b3a
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP